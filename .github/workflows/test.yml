name: Test

on: [push]

jobs:
  test:
    name: Test Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_chat_proxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_chat_proxy_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_chat_proxy_test
      APP_URL: http://localhost:3000
      APP_SECRET: ci-only-random-test-secret-not-for-deployment

    strategy:
      fail-fast: true
      matrix:
        node-version:
          - 25

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm fonts:prepare
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
